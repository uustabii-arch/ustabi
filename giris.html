<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ustabii | Giriş yap</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-active">
    <header class="topbar">
      <a class="brand" href="pazar.html" aria-label="ustabii ilan sayfası">
        <span class="brand-mark" aria-hidden="true">U</span>
      </a>
    </header>

    <main class="auth-shell form-page">
      <section class="auth-intro" aria-labelledby="login-title">
        <h1 id="login-title">Giriş yap</h1>
      </section>

      <section class="auth-card" aria-labelledby="login-form-title">
        <div class="auth-card-head">
          <a class="back-button" href="pazar.html">← İlanlara dön</a>
          <p class="eyebrow">Kayıtlı hesap</p>
          <h2 id="login-form-title">Hesabına gir</h2>
        </div>

        <form class="register-form active" id="loginForm">
          <label>
            E-posta
            <input name="email" type="email" placeholder="ornek@mail.com" autocomplete="email" required />
          </label>

          <label>
            Şifre
            <input name="password" type="password" minlength="6" placeholder="Şifren" autocomplete="current-password" required />
          </label>

          <button class="primary-action" type="submit">Giriş yap</button>
        </form>

        <form class="password-reset-form" data-password-reset>
          <button class="password-reset-toggle" type="button" data-password-reset-toggle>Şifremi unuttum</button>
          <div class="password-reset-fields" hidden>
            <label>
              E-posta
              <input name="resetEmail" type="email" placeholder="ornek@mail.com" autocomplete="email" />
            </label>
            <button class="ghost-action" type="submit">Sıfırlama maili gönder</button>
          </div>
        </form>

        <p class="auth-alt-link">
          Hesabın yoksa <a href="kayit.html">hesap tipi seç</a>.
        </p>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
