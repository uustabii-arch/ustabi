<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ustabii | Teklifler</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="pazar.html" aria-label="ustabii ilan sayfası">
        <span class="brand-mark" aria-hidden="true">U</span>
      </a>
    </header>

    <main class="listings-shell account-listings-shell">
      <section class="all-listings-section" aria-labelledby="offers-title">
        <div class="list-section-head">
          <div>
            <p class="eyebrow">Hesabım</p>
            <h1 id="offers-title">Teklifler</h1>
          </div>
          <a class="ghost-link" href="pazar.html">İlanlara dön</a>
        </div>

        <div class="offer-tabs" aria-label="Teklif türü">
          <button class="chip active" type="button" data-offer-filter="all">Tümü</button>
          <button class="chip" type="button" data-offer-filter="sent">Gönderilen</button>
          <button class="chip" type="button" data-offer-filter="incoming">Gelen</button>
        </div>

        <div class="offers-list" id="offersList"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
