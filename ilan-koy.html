<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ustabii | İlan koy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-active">
    <header class="topbar">
      <a class="brand" href="pazar.html" aria-label="ustabii ilan sayfası">
        <span class="brand-mark" aria-hidden="true">U</span>
      </a>
    </header>

    <main class="auth-shell form-page">
      <section class="auth-intro" aria-labelledby="post-listing-title">
        <p class="eyebrow">Yeni ilan</p>
        <h1 id="post-listing-title">İşini yayına al.</h1>
      </section>

      <section class="auth-card" aria-labelledby="listing-form-title">
        <div class="auth-card-head">
          <a class="back-button" href="pazar.html">← İlanlara dön</a>
          <p class="eyebrow">İlan bilgileri</p>
          <h2 id="listing-form-title">İlan oluştur</h2>
        </div>

        <form class="register-form active" id="listingCreateForm">
          <label>
            İş başlığı
            <input name="title" type="text" maxlength="72" placeholder="Örn. e-ticaret sitesi, elbise dikimi, 2+1 boya" required />
          </label>

          <div class="form-grid">
            <label class="category-picker-label">
              Kategori
              <input
                class="category-search-input"
                id="categorySearchInput"
                type="search"
                placeholder="Kategori ara: yazılım, terzi, boya..."
                autocomplete="off"
              />
              <select name="category" required>
                <option value="">Seç</option>
                <optgroup label="Yazılım ve teknoloji">
                  <option value="Yazılım geliştirme">Yazılım geliştirme</option>
                  <option value="Web sitesi">Web sitesi</option>
                  <option value="Mobil uygulama">Mobil uygulama</option>
                  <option value="E-ticaret">E-ticaret</option>
                  <option value="Backend API">Backend API</option>
                  <option value="WordPress">WordPress</option>
                  <option value="Shopify">Shopify</option>
                  <option value="Oyun geliştirme">Oyun geliştirme</option>
                </optgroup>
                <optgroup label="Tasarım ve medya">
                  <option value="UI/UX tasarım">UI/UX tasarım</option>
                  <option value="Grafik tasarım">Grafik tasarım</option>
                  <option value="Logo ve marka">Logo ve marka</option>
                  <option value="Video kurgu">Video kurgu</option>
                  <option value="Fotoğraf çekimi">Fotoğraf çekimi</option>
                </optgroup>
                <optgroup label="Pazarlama ve içerik">
                  <option value="Sosyal medya">Sosyal medya</option>
                  <option value="Dijital pazarlama">Dijital pazarlama</option>
                  <option value="SEO">SEO</option>
                  <option value="Reklam yönetimi">Reklam yönetimi</option>
                  <option value="İçerik yazarlığı">İçerik yazarlığı</option>
                </optgroup>
                <optgroup label="Giyim, tekstil ve üretim">
                  <option value="Giyim dikim">Giyim dikim</option>
                  <option value="Tekstil üretim">Tekstil üretim</option>
                  <option value="Moda tasarım">Moda tasarım</option>
                  <option value="Terzi">Terzi</option>
                </optgroup>
                <optgroup label="Ev, tadilat ve teknik servis">
                  <option value="Boya">Boya</option>
                  <option value="Tesisat">Tesisat</option>
                  <option value="Elektrik">Elektrik</option>
                  <option value="Montaj">Montaj</option>
                  <option value="Taşıma">Taşıma</option>
                  <option value="Temizlik">Temizlik</option>
                  <option value="Klima">Klima</option>
                </optgroup>
                <optgroup label="Diğer">
                  <option value="Diğer">Diğer</option>
                </optgroup>
              </select>
            </label>

            <div class="location-picker-card">
              <span>Konum</span>
              <select name="city" id="citySelect" required aria-label="İl seç">
                <option value="">İl seç</option>
              </select>
              <select name="district" id="districtSelect" required disabled aria-label="İlçe seç">
                <option value="">Önce il seç</option>
              </select>
            </div>
          </div>

          <label class="hidden-field" id="customCategoryField">
            İşe özel kategori başlığı
            <input name="customCategory" id="customCategoryInput" type="text" placeholder="Örn. ayakkabı kalıp tasarımı, podcast montajı" />
          </label>

          <div class="form-grid">
            <div class="work-date-group">
              <span class="work-date-heading">İş tarihi</span>
              <div class="work-date-grid">
                <select id="workDateDay" required aria-label="Gün"></select>
                <select id="workDateMonth" required aria-label="Ay"></select>
                <input id="workDateYear" type="text" readonly tabindex="-1" aria-label="Yıl" />
              </div>
              <input name="workDate" id="workDateInput" type="hidden" required />
            </div>

            <label>
              Tahmini süre
              <select name="duration" required>
                <option value="">Seç</option>
                <option value="1-2 saat">1-2 saat</option>
                <option value="Yarım gün">Yarım gün</option>
                <option value="1 gün">1 gün</option>
                <option value="2-3 gün">2-3 gün</option>
                <option value="1 hafta+">1 hafta+</option>
              </select>
            </label>
          </div>

          <div class="form-grid">
            <label>
              Bütçe
              <input name="budget" type="number" min="500" step="100" placeholder="Örn. 2500" required />
            </label>

            <label>
              İş / teslimat durumu
              <select name="materials" required>
                <option value="">Seç</option>
                <option value="Malzeme bende">Malzeme bende</option>
                <option value="Hizmeti veren getirsin">Hizmeti veren getirsin</option>
                <option value="Birlikte karar verelim">Birlikte karar verelim</option>
              </select>
            </label>
          </div>

          <label>
            İletişim telefonu
            <input name="phone" type="tel" placeholder="05xx xxx xx xx" autocomplete="tel" required />
          </label>

          <fieldset class="profile-fieldset listing-promotion-fieldset">
            <legend>Görünürlük hakları</legend>
            <div class="promotion-rights-grid">
              <label class="promotion-right-card" id="featuredPromotionCard">
                <input name="useFeaturedPromotion" id="useFeaturedPromotion" type="checkbox" value="1" />
                <span>
                  <strong>Öne çıkan / kaydırmalı alan</strong>
                  <small id="featuredPromotionMeta">Kredi bilgisi yükleniyor</small>
                </span>
              </label>

              <div class="promotion-right-card promotion-color-card" id="colorPromotionCard">
                <label class="promotion-option-label">
                  <input name="useColorPromotion" id="useColorPromotion" type="checkbox" value="1" />
                  <span>
                    <strong>Renkli arka plan</strong>
                    <small id="colorPromotionMeta">Kredi bilgisi yükleniyor</small>
                  </span>
                </label>
                <label class="promotion-color-picker">
                  <span>Renk</span>
                  <input name="highlightColor" id="highlightColorInput" type="color" value="#fbcfe8" disabled />
                </label>
              </div>
            </div>
          </fieldset>

          <label>
            Adres / ulaşım notu
            <textarea name="addressNote" rows="3" placeholder="Adres, teslimat, online görüşme veya ulaşım notu yaz."></textarea>
          </label>

          <label>
            İşi yapacak kişiden beklentiler
            <textarea name="expectations" rows="3" placeholder="Teslim formatı, ekipman, deneyim, keşif veya çalışma şekli beklentini yaz."></textarea>
          </label>

          <label class="tag-input-label">
            Etiketler
            <input name="tags" type="text" placeholder="Örn. react, logo, acil, dikim, online" />
          </label>

          <label>
            İlan fotoğrafı
            <input name="image" id="listingImageInput" type="file" accept="image/*" />
          </label>

          <div class="upload-preview" id="listingImagePreview" hidden>
            <img alt="İlan fotoğrafı önizleme" />
          </div>

          <label>
            Açıklama
            <textarea name="details" rows="5" placeholder="İşin kapsamını, teslim beklentini, bütçeyi etkileyen detayları ve özel notları yaz." required></textarea>
          </label>

          <button class="primary-action" type="submit">İlanı paylaş</button>
        </form>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="turkey-locations.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
