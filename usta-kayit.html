<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ustabii | Hizmet veren kaydı</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-active">
    <header class="topbar">
      <a class="brand" href="pazar.html" aria-label="ustabii ilan sayfası">
        <span class="brand-mark" aria-hidden="true">U</span>
      </a>
    </header>

    <main class="auth-shell form-page">
      <section class="auth-intro" aria-labelledby="master-title">
        <h1 id="master-title">Hizmet veren hesabı aç</h1>
      </section>

      <section class="auth-card" aria-labelledby="register-title">
        <div class="auth-card-head">
          <a class="back-button" href="kayit.html">← Seçime dön</a>
          <p class="eyebrow">Hizmet veren kaydı</p>
          <h2 id="register-title">Hizmet profilini oluştur</h2>
        </div>

        <form class="register-form active" id="masterRegisterPage">
          <div class="form-grid">
            <label>
              Ad soyad
              <input name="fullName" type="text" placeholder="Örn. Ali Kaya" autocomplete="name" required />
            </label>

            <label>
              Sektör / beceri
              <select name="profession" id="professionSelect" required>
                <option value="">Seç</option>
                <option value="Diğer">Diğer</option>
                <optgroup label="Yazılım ve teknoloji">
                  <option value="Yazılım geliştirme">Yazılım geliştirme</option>
                  <option value="Web sitesi">Web sitesi</option>
                  <option value="Mobil uygulama">Mobil uygulama</option>
                  <option value="E-ticaret">E-ticaret</option>
                  <option value="Backend API">Backend API</option>
                  <option value="WordPress">WordPress</option>
                </optgroup>
                <optgroup label="Tasarım ve medya">
                  <option value="UI/UX tasarım">UI/UX tasarım</option>
                  <option value="Grafik tasarım">Grafik tasarım</option>
                  <option value="Video kurgu">Video kurgu</option>
                  <option value="Fotoğraf çekimi">Fotoğraf çekimi</option>
                </optgroup>
                <optgroup label="Pazarlama ve içerik">
                  <option value="Sosyal medya">Sosyal medya</option>
                  <option value="Dijital pazarlama">Dijital pazarlama</option>
                  <option value="SEO">SEO</option>
                  <option value="İçerik yazarlığı">İçerik yazarlığı</option>
                </optgroup>
                <optgroup label="Giyim, tekstil ve üretim">
                  <option value="Giyim dikim">Giyim dikim</option>
                  <option value="Tekstil üretim">Tekstil üretim</option>
                  <option value="Moda tasarım">Moda tasarım</option>
                  <option value="Terzi">Terzi</option>
                </optgroup>
                <optgroup label="Ev, tadilat ve teknik servis">
                  <option value="Boya">Boya</option>
                  <option value="Tesisat">Tesisat</option>
                  <option value="Elektrik">Elektrik</option>
                  <option value="Montaj">Montaj</option>
                  <option value="Temizlik">Temizlik</option>
                  <option value="Klima">Klima</option>
                </optgroup>
              </select>
            </label>
          </div>

          <label class="hidden-field" id="customProfessionField">
            Sektörünü veya becerini yaz
            <input name="customProfession" id="customProfessionInput" type="text" placeholder="Örn. yazılım, modelistlik, mermer işi" />
          </label>

          <div class="form-grid">
            <label>
              Telefon numarası
              <input name="phone" type="tel" placeholder="05xx xxx xx xx" autocomplete="tel" required />
            </label>

            <label>
              E-posta
              <input name="email" type="email" placeholder="ornek@mail.com" autocomplete="email" required />
            </label>
          </div>

          <div class="form-grid">
            <label>
              İl
              <select name="city" id="masterCitySelect" required>
                <option value="">İl seç</option>
              </select>
            </label>

            <label>
              İlçe
              <select name="district" id="masterDistrictSelect" required disabled>
                <option value="">Önce il seç</option>
              </select>
            </label>

            <label>
              Deneyim
              <select name="experience" required>
                <option value="">Seç</option>
                <option value="0-1 yıl">0-1 yıl</option>
                <option value="1-3 yıl">1-3 yıl</option>
                <option value="3-5 yıl">3-5 yıl</option>
                <option value="5+ yıl">5+ yıl</option>
              </select>
            </label>
          </div>

          <div class="form-grid">
            <label>
              Günlük ücret beklentisi
              <input name="dailyRate" type="number" min="500" step="100" placeholder="Örn. 2500" required />
            </label>

            <label>
              Şifre
              <input name="password" type="password" minlength="6" placeholder="En az 6 karakter" autocomplete="new-password" required />
            </label>
          </div>

          <label>
            Kısa profil açıklaması
            <textarea name="bio" rows="4" placeholder="Hangi işleri yaptığını, çalışma şeklini, teslim süreni ve hangi günler müsait olduğunu yaz." required></textarea>
          </label>

          <button class="primary-action" type="submit">Hizmet veren hesabı aç</button>
        </form>

        <form class="password-reset-form" data-password-reset>
          <button class="password-reset-toggle" type="button" data-password-reset-toggle>Şifremi unuttum</button>
          <div class="password-reset-fields" hidden>
          <label>
            E-posta
            <input name="resetEmail" type="email" placeholder="ornek@mail.com" autocomplete="email" />
          </label>
            <button class="ghost-action" type="submit">Sıfırlama maili gönder</button>
          </div>
        </form>

        <p class="auth-alt-link">
          Zaten hesabın var mı? <a href="giris.html">Giriş yap</a>.
        </p>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="turkey-locations.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
