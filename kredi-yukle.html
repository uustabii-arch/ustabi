<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USTABI | Kredi yükle</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-active">
    <header class="topbar">
      <a class="brand" href="pazar.html" aria-label="USTABI ilan sayfası">
        <span class="brand-mark">UB</span>
        <span>USTABI</span>
      </a>
    </header>

    <main class="auth-shell upgrade-page-shell">
      <section class="auth-intro" aria-labelledby="credit-page-title">
        <p class="eyebrow">USTABI kredisi</p>
        <h1 id="credit-page-title">İlanını görünür yapmak için kredi kullan.</h1>
        <p class="lead">
          İlan ve teklif göndermek sınırsızdır. Kredi sadece renkli ilan, reklam ve öne çıkan
          kaydırmalı alanlarda görünmek için kullanılır.
        </p>
      </section>

      <section class="auth-card upgrade-page-card" aria-label="Kredi paketleri">
        <div class="auth-card-head">
          <a class="back-button" href="pazar.html">← Panele dön</a>
          <p class="eyebrow" id="creditBalanceText">Bakiye yükleniyor</p>
          <h2>Kredi paketleri</h2>
        </div>

        <div class="plan-grid credit-grid" id="creditTopupGrid"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
