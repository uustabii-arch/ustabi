<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USTABI | Kredi yükle</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-active">
    <header class="topbar">
      <a class="brand" href="pazar.html" aria-label="USTABI ilan sayfası">
        <span class="brand-mark">UB</span>
        <span>USTABI</span>
      </a>
    </header>

    <main class="auth-shell upgrade-page-shell">
      <section class="auth-intro" aria-labelledby="credit-page-title">
        <p class="eyebrow">USTABI kredisi</p>
        <h1 id="credit-page-title">Kredi yükle</h1>
      </section>

      <section class="auth-card upgrade-page-card" aria-label="Kredi paketleri">
        <div class="auth-card-head">
          <a class="back-button" href="pazar.html">← Panele dön</a>
          <p class="eyebrow" id="creditBalanceText">Bakiye yükleniyor</p>
          <h2>Kredi paketleri</h2>
        </div>

        <div class="plan-grid credit-grid" id="creditTopupGrid">
          <button class="plan-card credit-package" type="button" data-credit-amount="10" data-credit-price="99">
            <strong>10 kredi</strong>
            <span>30 TL</span>
          </button>

          <button class="plan-card credit-package" type="button" data-credit-amount="25" data-credit-price="199">
            <strong>25 kredi</strong>
            <span>90 TL</span>
          </button>

          <button class="plan-card credit-package" type="button" data-credit-amount="50" data-credit-price="349">
            <strong>50 kredi</strong>
            <span>160 TL</span>
          </button>

          <button class="plan-card credit-package" type="button" data-credit-amount="100" data-credit-price="599">
            <strong>100 kredi</strong>
            <span>300 TL</span>
          </button>

          <button class="plan-card credit-package" type="button" data-credit-amount="250" data-credit-price="1299">
            <strong>250 kredi</strong>
            <span>600 TL</span>
          </button>

          <button class="plan-card credit-package" type="button" data-credit-amount="500" data-credit-price="2299">
            <strong>500 kredi</strong>
            <span>1.100 TL</span>
          </button>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
